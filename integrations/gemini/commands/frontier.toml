# Maestro Frontier — Gemini CLI custom command
#
# Install path (pick one):
#   Project-scoped : <project>/.gemini/commands/frontier.toml
#   Global         : ~/.gemini/commands/frontier.toml
#
# Once installed, invoke with `/frontier <args>` inside the Gemini CLI.
# This command arms or queries the Maestro Frontier engine with
# `--scope gemini`, keeping Gemini's state independent from Claude Code,
# Codex, and Cursor on the same machine.
#
# Requires `maestro` on PATH (installed during Maestro setup).

description = "Maestro Frontier local multi-CLI fusion engine — switch mode, or run a prompt through the panel"

prompt = """
Drive the **Maestro Frontier** engine — a zero-dependency local multi-CLI fusion
engine (a parallel panel of local CLIs → a judge model's analysis → a grounded
synthesis). It is the same engine the Claude Code plugin ships; here it runs
through the `maestro` CLI with `--scope gemini`.

**This is a typing shortcut, not the Claude Code plugin.** Gemini CLI has no
prompt hook, so arming a mode does **not** auto-run the engine on later prompts —
it only persists the mode. To actually fuse a prompt, invoke `run` explicitly
(step 4).

Requested action: {{args}}

Map it to one engine CLI call and execute it. Do not edit the engine's state
file by hand.

1. Inspect or compose before choosing a model/preset. `frontier catalog` is the
   source of truth for locally selectable models, named presets (including
   legacy presets), aliases, and readiness. It does not print secrets or
   configured model IDs. `compose` validates ready models and arms the resolved
   custom panel unless `--dry-run` is supplied:

   ```text
   maestro frontier catalog
   maestro frontier compose --models <model-a>,<model-b> --scope gemini
   maestro frontier compose --models <model-a>,<model-b> --judge <model> --synth <model> --effort <level> --save my-panel --scope gemini
   maestro frontier compose --models <model-a>,<model-b> --dry-run --scope gemini
   maestro frontier effort <auto|low|medium|high|xhigh|max|ultra> --scope gemini
   ```

2. Switch mode (persists under Maestro's platform-specific config directory:
   `$XDG_CONFIG_HOME/maestro` when set; otherwise `%APPDATA%\maestro` on
   Windows or `~/.config/maestro`; default `off`).
   `--scope gemini` keeps Gemini's armed mode independent from Claude Code, Codex,
   and Cursor on the same machine:

   ```text
   maestro frontier mode off --scope gemini
   maestro frontier mode single --model <model> --scope gemini
   maestro frontier mode fusion --preset <preset> --scope gemini
   maestro frontier mode fusion --preset custom --models <a,b,c> --scope gemini
   maestro frontier mode fusion --preset <preset> --judge <model> --synth <model> --scope gemini
   ```

   Existing named presets remain supported; use `frontier catalog` instead of a
   static list. `--judge` / `--synth` can override either stage for a named
   preset. For a ready explicit panel, prefer `frontier compose` above.

3. Show the current mode/preset:

   `maestro frontier status --scope gemini`

4. Run a prompt through the current mode — **this is the action that actually
   fuses**, since nothing auto-runs here. Set a mode first (step 2), then:

   `maestro frontier run "{{args}}" --scope gemini`

   - `off`: prints a notice, spawns nothing.
   - `single`: dispatches the one selected CLI, prints its answer.
   - `fusion`: runs the panel in parallel → judge → synthesizer; prints the final
     answer (a one-line run meta goes to stderr). Report stdout verbatim.

On error the engine prints `ERROR [<reason>]: <detail>` to stderr and exits
non-zero — relay the reason.

Notes:

- Real `single`/`fusion` runs spawn local CLIs and cost tokens; use small prompts.
  `off` is free. Every panel, judge, and synthesizer subprocess runs in the
  provider CLI's read-only/planning mode.
- Each model's CLI must be on `PATH`, or point at a specific build with
  `MAESTRO_CLAUDE_BIN` / `MAESTRO_CODEX_BIN` / `MAESTRO_GEMINI_BIN`.
- Claude selectors: `opus` pins Opus 5.5 (`claude-opus-5-5`), `fable` pins
  Fable 5.1 (`claude-fable-5-1`), `sonnet-5` keeps Sonnet 5
  (`claude-sonnet-5`), and `haiku` adds Haiku 4.5
  (`claude-haiku-4-5-20251001`). Claude Code v2.1.280+ is required for Opus
  5.5; v2.1.257+ is required for Fable 5.1. Opus, Fable, and Sonnet support
  `low`, `medium`, `high`, `xhigh`, and `max`; Haiku has no effort flag.
  Codex selectors include `astra` (`gpt-6-astra`), `sol` (`gpt-6-sol`),
  `terra` (`gpt-5.6-terra`), `luna` (`gpt-6-luna`), `auto-review`, and the
  retained GPT-5.5, GPT-5.4, GPT-5.4 Mini, and GPT-5.3 Codex Spark selectors.
  GPT-6 supports `low`, `medium`, `high`, `xhigh`, and `max` in Maestro’s UI,
  without `none` or `ultra`. Earlier explicit selectors and third-party
  adapters remain available. Confirm exact aliases, supported efforts, and
  readiness with `frontier catalog`.
- `MAESTRO_FRONTIER_MODEL_TERRA`, `MAESTRO_FRONTIER_MODEL_LUNA`, and
  `MAESTRO_FRONTIER_MODEL_SOL` remain optional model-ID overrides.
- Run `node frontier/smoke.cjs` from the installed engine root for release
  verification.
- On Windows, `gemini` is a poor `--judge`/`--synth` choice: judge/synth prompts
  contain newlines that the win32 arg-safety guard refuses. Use `opus` or `sol`
  for judge/synth on Windows.
- Requires `maestro` on `PATH` (installed during Maestro setup). If it is missing,
  install Maestro first.
"""
